<title>FLOW · Accesso</title>
<style>
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --label: #1D1D1F; --label-2: rgba(60,60,67,.62); --label-3: rgba(60,60,67,.32);
  --sep: rgba(60,60,67,.16); --fill: rgba(120,120,128,.12); --blue: #007AFF; --red: #FF3B30;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --surface: #1C1C1E; --label: #F5F5F7; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --blue: #0A84FF; --red: #FF453A; color-scheme: dark; }
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--label); font: 400 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
* { box-sizing: border-box; }
form { width: min(340px, 100%); display: grid; gap: 14px; margin-bottom: 12vh; }
.brand { font: 700 12px/1 var(--font); letter-spacing: .16em; color: var(--label-2); margin: 0; }
h1 { font: 700 30px/1.15 var(--font); letter-spacing: -.022em; margin: 0 0 6px; }
input { width: 100%; font: 400 17px/1.3 var(--font); color: var(--label); background: var(--surface); border: .5px solid var(--sep); border-radius: 12px; padding: 13px 14px; }
input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 20%, transparent); }
button { font: 600 17px/1 var(--font); color: #fff; background: var(--blue); border: 0; border-radius: 12px; padding: 14px; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--red); font-size: 14px; margin: 0; min-height: 1.4em; }
</style>
<form id="f">
  <p class="brand">FLOW</p>
  <h1>Bentornato</h1>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required autofocus>
  <button id="go" type="submit">Entra</button>
  <p class="err" id="err" role="alert"></p>
</form>
<script>
const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
f.addEventListener('submit', async e => {
  e.preventDefault();
  go.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (r.ok) { location.href = '/'; return; }
    err.textContent = (await r.json().catch(() => ({}))).error || 'Accesso non riuscito.';
  } catch { err.textContent = 'Connessione assente. Riprova tra poco.'; }
  go.disabled = false; document.getElementById('pw').select();
});
</script>
