<title>FLOW · Accesso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap">
<script>try { document.documentElement.dataset.skin = localStorage.getItem('flow-skin') || 'carta'; } catch {}</script>
<style>
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --label: #1D1D1F; --label-2: rgba(60,60,67,.62); --label-3: rgba(60,60,67,.32);
  --sep: rgba(60,60,67,.16); --fill: rgba(120,120,128,.12); --blue: #007AFF; --red: #FF3B30;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --surface: #1C1C1E; --label: #F5F5F7; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --blue: #0A84FF; --red: #FF453A; color-scheme: dark; }
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--label); font: 400 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
* { box-sizing: border-box; }
.box { width: min(340px, 100%); display: grid; gap: 14px; margin-bottom: 12vh; }
.brand { font: 700 12px/1 var(--font); letter-spacing: .16em; color: var(--label-2); margin: 0; }
h1 { font: 700 30px/1.15 var(--font); letter-spacing: -.022em; margin: 0 0 6px; }
.google { display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 17px/1 var(--font); color: var(--label); background: var(--surface); border: .5px solid var(--sep); border-radius: 12px; padding: 14px; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.google:hover { background: color-mix(in srgb, var(--surface) 92%, var(--label)); }
.google svg { width: 18px; height: 18px; flex: none; }
.note { color: var(--label-2); font-size: 13px; margin: 0; }
/* tema Carta: bianco e nero, Geologica, maiuscolo spaziato */
[data-skin="carta"] { --bg: #fff; --surface: #fff; --label: #111; --sep: #111; --font: "Geologica", system-ui, sans-serif; }
[data-skin="carta"] body { text-align: center; }
[data-skin="carta"] h1 { font: 600 20px/1.2 var(--font); text-transform: uppercase; letter-spacing: .2em; margin-bottom: 18px; }
[data-skin="carta"] .brand { color: var(--label); }
[data-skin="carta"] .google { border: 1px solid var(--sep); border-radius: 0; box-shadow: none; font: 500 12px/1 var(--font); text-transform: uppercase; letter-spacing: .18em; padding: 16px; }
.err { color: var(--red); font-size: 14px; margin: 0; min-height: 1.4em; }
</style>
<main class="box">
  <p class="brand">FLOW</p>
  <h1>Bentornato</h1>
  <a class="google" href="/api/auth/google"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>Accedi con Google</a>
  <p class="err" id="err" role="alert"></p>
  <p class="note">Entra chi è stato invitato in uno spazio di Flow.</p>
</main>
<script>
const msg = {
  noaccess: 'Questo account Google non è stato invitato. Chiedi a chi gestisce Flow di aggiungere la tua email.',
  retry: 'Accesso non riuscito. Riprova.',
  config: 'Il login con Google non è ancora configurato su Vercel.'
}[new URLSearchParams(location.search).get('e')];
if (msg) document.getElementById('err').textContent = msg;
</script>
