<style>
/* Layout: barra in alto con titolo grande in stile iOS, sotto le colonne affiancate a larghezza fissa che scorrono in orizzontale, come su Trello, anche su telefono. */
:root {
  /* bacheche (in entrambi i temi): colori pieni, come una mazzetta Pantone */
  --bc-0: #D2232A; --bc-1: #E06F2A; --bc-2: #9BD8D2; --bc-3: #5A9B63; --bc-4: #1F3A9A; --bc-5: #BF3AAB;
  --bg: #F2F2F7;
  --surface: #FFFFFF;
  --fill: rgba(120,120,128,.12);
  --fill-strong: rgba(120,120,128,.2);
  --label: #1D1D1F;
  --label-2: rgba(60,60,67,.62);
  --label-3: rgba(60,60,67,.32);
  --sep: rgba(60,60,67,.16);
  --blue: #007AFF;
  --red: #FF3B30;
  --orange: #FF9500;
  --green: #34C759;
  --purple: #AF52DE;
  --teal: #30B0C7;
  --pink: #FF2D55;
  --card-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.05);
  --lift-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.14);
  --scrim: rgba(0,0,0,.28);
  --on-accent: #fff;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* Scala tipografica: Titolo grande 30 · Titolo 20 · Intestazione 15 · Corpo 15 · Secondario 13 · Didascalia 12 */
  --t-large: 700 30px/1.15 var(--font-display);
  --t-title: 600 20px/1.25 var(--font-display);
  --t-head: 600 15px/1.33 var(--font);
  --t-body: 400 15px/1.4 var(--font);
  --t-sub: 400 13px/1.38 var(--font);
  --t-cap: 500 12px/1.33 var(--font);

  --r-card: 12px;
  --r-group: 12px;
  --col-w: 272px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E;
    --fill: rgba(118,118,128,.24); --fill-strong: rgba(118,118,128,.36);
    --label: #F5F5F7; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.55);
    --blue: #0A84FF; --red: #FF453A; --orange: #FF9F0A; --green: #30D158;
    --purple: #BF5AF2; --teal: #40C8E0; --pink: #FF375F;
    --card-shadow: 0 0 0 .5px rgba(255,255,255,.06);
    --lift-shadow: 0 0 0 .5px rgba(255,255,255,.1), 0 12px 32px rgba(0,0,0,.6);
    --scrim: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E;
  --fill: rgba(118,118,128,.24); --fill-strong: rgba(118,118,128,.36);
  --label: #F5F5F7; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.55);
  --blue: #0A84FF; --red: #FF453A; --orange: #FF9F0A; --green: #30D158;
  --purple: #BF5AF2; --teal: #40C8E0; --pink: #FF375F;
  --card-shadow: 0 0 0 .5px rgba(255,255,255,.06);
  --lift-shadow: 0 0 0 .5px rgba(255,255,255,.1), 0 12px 32px rgba(0,0,0,.6);
  --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}

/* ——— Tema Carta: come un planner stampato. Bianco e nero, linee sottili, titoli in maiuscolo spaziato, Geologica.
   Il colore resta solo dove ha un significato (scadenze, etichette). ——— */
:root[data-skin="carta"] {
  --bg: #FFFFFF; --surface: #FFFFFF;
  --fill: #F3F3F3; --fill-strong: #E8E8E8;
  --label: #141414; --label-2: #6E6E6E; --label-3: #ABABAB;
  --sep: #E4E4E4; --rule: #141414;
  --blue: #141414; --on-accent: #FFFFFF;
  --card-shadow: none;
  --lift-shadow: 0 0 0 1px #141414, 0 18px 40px rgba(0,0,0,.08);
  --scrim: rgba(250,250,250,.72);
  --font: "Geologica", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: var(--font);
  --t-large: 400 26px/1.2 var(--font);
  --t-title: 500 19px/1.3 var(--font);
  --t-head: 500 14px/1.35 var(--font);
  --t-body: 400 15px/1.45 var(--font);
  --t-sub: 400 13px/1.4 var(--font);
  --t-cap: 500 11px/1.35 var(--font);
  --caps: .18em;
  /* post-it: toni carta smorzati */
  --pi-0: #EADFC4; --pi-1: #E6A9A2; --pi-2: #AFC1D1; --pi-3: #C9A9AE; --pi-4: #C3D6B4; --pi-5: #F2C29E;
  --pi-ink: #1E1E1E;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-skin="carta"]:not([data-theme="light"]) {
    --bg: #0F0F0F; --surface: #0F0F0F; --fill: #1C1C1C; --fill-strong: #262626;
    --label: #EDEDED; --label-2: #9A9A9A; --label-3: #5E5E5E; --sep: #262626; --rule: #EDEDED;
    --blue: #EDEDED; --on-accent: #0F0F0F;
    --lift-shadow: 0 0 0 1px #EDEDED, 0 18px 40px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-skin="carta"][data-theme="dark"] {
  --bg: #0F0F0F; --surface: #0F0F0F; --fill: #1C1C1C; --fill-strong: #262626;
  --label: #EDEDED; --label-2: #9A9A9A; --label-3: #5E5E5E; --sep: #262626; --rule: #EDEDED;
  --blue: #EDEDED; --on-accent: #0F0F0F;
  --lift-shadow: 0 0 0 1px #EDEDED, 0 18px 40px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--label);
  font: var(--t-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { height: 100%; display: flex; flex-direction: column; }

/* Barra superiore */
.top {
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: 12px 14px;
  display: grid; gap: 6px;
}
.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--blue); font: var(--t-body); margin-left: -4px; }
.back svg.i { width: 18px; height: 18px; stroke-width: 2; }
.nav-right { display: flex; align-items: center; gap: 8px; }
.view-wrap { position: relative; }
.view-menu { top: 38px; min-width: 250px; z-index: 15; }
.view-menu .menu-head { font: var(--t-cap); color: var(--label-2); padding: 8px 12px 4px; margin: 0; }
.view-menu .mi { display: flex; align-items: flex-start; gap: 8px; }
.view-menu .mk { padding-top: 3px; flex: none; }
.view-menu .vt { display: grid; gap: 1px; }
.view-menu .vt b { font: var(--t-body); font-weight: 500; }
.view-menu .vt small { font: var(--t-cap); color: var(--label-2); margin: 0; padding: 0; }
.proto { font: var(--t-cap); color: var(--label-2); background: var(--fill); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.board-title {
  font: var(--t-large); letter-spacing: -.022em;
  border: 0; background: none; padding: 0; margin: 0; width: 100%;
  border-radius: 6px;
}
.board-title:focus { outline: none; box-shadow: 0 0 0 2px var(--blue); }

/* Controllo segmentato (solo telefono) */
.seg-wrap { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0 10px; display: none; }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; font: var(--t-cap); font-size: 13px; padding: 6px 12px; border-radius: 7px; color: var(--label); white-space: nowrap; }
.seg button[aria-current="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); font-weight: 600; }

/* Bacheca */
.board {
  flex: 1; min-height: 0;
  display: flex; align-items: flex-start; gap: 12px;
  overflow-x: auto; overflow-y: hidden;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: 4px 20px;
  scroll-padding-inline: var(--gutter-l) var(--gutter-r);
}
.col {
  flex: 0 0 var(--col-w); max-height: 100%;
  display: flex; flex-direction: column;
  border-radius: 14px;
  transition: background-color .15s;
}
.col.over { background: var(--fill); }
.col-head { display: flex; align-items: baseline; gap: 8px; padding: 6px 8px 8px; margin: 0; }
.col-title { font: var(--t-head); margin: 0; flex: 1; min-width: 0; }
.col-title input { font: inherit; border: 0; background: none; padding: 0; width: 100%; border-radius: 4px; }
.col-title input:focus { outline: none; box-shadow: 0 0 0 2px var(--blue); }
.col-title input:hover:not(:focus) { background: var(--fill); box-shadow: 0 0 0 3px var(--fill); }
.col-kind { font: var(--t-cap); color: var(--label-3); }
.count { font: var(--t-sub); color: var(--label-2); font-variant-numeric: tabular-nums; }

.list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 2px 4px 4px; min-height: 12px; }

.card {
  background: var(--surface); border-radius: var(--r-card);
  box-shadow: var(--card-shadow);
  padding: 11px 12px 10px;
  display: grid; gap: 7px;
  cursor: pointer; user-select: none;
  transition: box-shadow .15s, transform .15s;
}
.card:hover { box-shadow: var(--lift-shadow); }
.card { -webkit-touch-callout: none; -webkit-user-select: none; }
.card.dragging { display: none; }
.ghost { position: fixed; left: 0; top: 0; z-index: 30; margin: 0; pointer-events: none; box-shadow: var(--lift-shadow); transition: none; }
.board.is-dragging { scroll-snap-type: none !important; }
body.grabbing, body.grabbing * { cursor: grabbing !important; }
.card-title { font: var(--t-body); font-weight: 500; margin: 0; text-wrap: pretty; overflow-wrap: anywhere; }
.col[data-type="fatto"] .card-title { color: var(--label-2); }
.labels { display: flex; flex-wrap: wrap; gap: 4px; }
.lab {
  --c: var(--blue);
  font: var(--t-cap); font-size: 11px; letter-spacing: .01em;
  color: color-mix(in srgb, var(--c) 78%, var(--label));
  background: color-mix(in srgb, var(--c) 14%, transparent);
  padding: 2px 7px; border-radius: 99px;
}
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font: var(--t-cap); color: var(--label-2); font-variant-numeric: tabular-nums; }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.due-soon { color: var(--orange); }
.due-late { color: var(--red); }
.check-done { color: var(--green); }
.ph { border-radius: var(--r-card); background: var(--fill); border: 1.5px dashed var(--fill-strong); }

.add { display: flex; align-items: center; gap: 6px; margin: 4px 4px 0; padding: 10px 12px; border-radius: 10px; color: var(--label-2); font: var(--t-body); text-align: left; }
.add:hover { background: var(--fill); color: var(--label); }
.add-form { margin: 4px 4px 0; }
/* Colonna vuota: il pulsante prende il posto della prima scheda, alla stessa altezza delle schede accanto */
.list:empty { min-height: 0; padding-bottom: 0; }
.list:empty + .add, .list:empty + .add-form { margin-top: 0; }
.add-form textarea {
  width: 100%; resize: none; border: 0; border-radius: var(--r-card);
  background: var(--surface); box-shadow: 0 0 0 2px var(--blue);
  padding: 11px 12px; font: var(--t-body); font-weight: 500;
}
.add-form textarea:focus { outline: none; }
.hint { font: var(--t-cap); color: var(--label-3); padding: 6px 4px 0; margin: 0; }

.col-new { flex-basis: var(--col-w); }
.col-new .add { margin: 0; border: 1.5px dashed var(--fill-strong); justify-content: center; }

/* Scheda aperta */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .2s ease; }
.sheet {
  position: relative; width: min(540px, 100%); max-height: min(760px, 100%);
  background: var(--bg); border-radius: 16px; box-shadow: var(--lift-shadow);
  display: flex; flex-direction: column; overflow: hidden;
  animation: rise .28s cubic-bezier(.2,.9,.3,1);
}
.sheet-bar { display: flex; align-items: center; justify-content: flex-end; padding: 12px 16px 6px; }
.bar-actions { display: flex; align-items: center; gap: 6px; }
.bar-actions .bar-btn { width: 30px; height: 30px; background: var(--fill); color: var(--label-2); }
.bar-actions .bar-btn:hover, .bar-actions .bar-btn[aria-expanded="true"] { background: var(--fill-strong); color: var(--label); }
.bar-actions .bar-btn svg.i { width: 16px; height: 16px; stroke-width: 2; }
.card-menu { min-width: 210px; }
.menu .menu-head { font: var(--t-cap); color: var(--label-2); padding: 8px 12px 4px; margin: 0; }
.menu .mi { display: flex; align-items: center; gap: 8px; }
.menu-sep { height: .5px; background: var(--sep); margin: 4px 8px; }
.card-menu .sub-open small { margin-left: auto; padding-left: 12px; font: var(--t-cap); color: var(--label-3); }
.card-menu .sub-open svg.i, .card-menu .sub-back svg.i { width: 14px; height: 14px; color: var(--label-3); flex: none; }
.card-menu .sub-back { font-weight: 600; gap: 6px; }
.card-menu .sub-back svg.i { color: var(--blue); }
.card-menu .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); flex: none; }
/* colore attuale: un anello intorno al pallino */
.card-menu .mi[aria-checked="true"] .dot { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--label); }
.card-menu .mi { gap: 12px; }
.card-menu .sub-open svg.i, .card-menu .mk.end { margin-left: auto; }
/* tema Carta: le voci dei menu come quelle delle sezioni, maiuscole e spaziate */
[data-skin="carta"] .menu .mi, [data-skin="carta"] .menu > button { font: 500 11px/1.3 var(--font); text-transform: uppercase; letter-spacing: .14em; padding: 11px 12px; }
[data-skin="carta"] .menu .mi small { text-transform: none; letter-spacing: 0; }
[data-skin="carta"] .card-menu .sub-back { font-weight: 600; }
.card-menu { min-width: 250px; }
.card-menu .mi { white-space: nowrap; }
.grabber { display: none; }
.btn-text { color: var(--blue); font: var(--t-body); padding: 4px 2px; }
.btn-text.strong { font-weight: 600; }
.btn-text.danger { color: var(--red); }
.sheet-body { overflow-y: auto; padding: 4px 16px 28px; display: grid; gap: 8px; }
.f-title {
  font: var(--t-title); letter-spacing: -.01em; border: 0; background: none; resize: none;
  padding: 4px 0 8px; width: 100%; field-sizing: content; min-height: 1.25em; border-radius: 6px;
}
.f-title:focus { outline: none; }
.g-head { font: var(--t-cap); color: var(--label-2); text-transform: uppercase; letter-spacing: .05em; margin: 14px 4px 0; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.group { background: var(--surface); border-radius: var(--r-group); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); }
.row > .k { flex: 1; }
.row select, .row input[type="date"] { border: 0; background: var(--fill); border-radius: 7px; padding: 5px 9px; font: var(--t-body); color: var(--label); }
.row .clear { color: var(--label-3); font: var(--t-sub); }
.row input.inline { flex: 1; min-width: 0; border: 0; background: none; padding: 11px 0; font: var(--t-body); }
.row input.inline:focus { outline: none; }
.row input.inline::placeholder, .notes::placeholder { color: var(--label-3); }
.tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--label-3); display: grid; place-items: center; flex: none; color: var(--on-accent); }
.tick[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); }
.tick svg.i { width: 12px; height: 12px; stroke-width: 2.4; opacity: 0; }
.tick[aria-pressed="true"] svg.i { opacity: 1; }
.tick[aria-pressed="true"] + input { color: var(--label-2); text-decoration: line-through; text-decoration-color: var(--label-3); }
.plus { width: 22px; height: 22px; display: grid; place-items: center; color: var(--blue); flex: none; }
.plus svg.i { width: 18px; height: 18px; stroke-width: 2; }
.notes { width: 100%; border: 0; background: none; resize: none; padding: 12px 14px; font: var(--t-body); min-height: 96px; field-sizing: content; display: block; }
.notes:focus { outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  --c: var(--blue);
  display: inline-flex; align-items: center; gap: 6px;
  font: var(--t-sub); padding: 6px 12px 6px 10px; border-radius: 99px;
  background: var(--surface); box-shadow: inset 0 0 0 .5px var(--sep);
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 14%, var(--surface)); box-shadow: inset 0 0 0 1.5px var(--c); font-weight: 600; }
.link { flex: 1; min-width: 0; display: grid; padding: 9px 0; text-decoration: none; color: inherit; }
.link b { font: var(--t-body); color: var(--blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link small { font: var(--t-cap); color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rm { color: var(--label-3); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; flex: none; }
.rm:hover { color: var(--red); background: var(--fill); }
.stamp { font: var(--t-cap); color: var(--label-3); text-align: center; margin: 16px 0 0; }

/* Dettaglio scheda: titolo, una riga di pillole (Descrizione, Messaggi, moduli aggiunti, + Aggiungi), sotto il contenuto */
.sheet { background: var(--surface); height: min(640px, 100%); }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--blue); }
.icon-btn:hover { background: var(--fill); }
.icon-btn svg.i { width: 20px; height: 20px; }
.more-wrap { position: relative; flex: none; }
.menu { position: absolute; top: 38px; left: 0; z-index: 3; min-width: 190px; padding: 4px; background: var(--surface); border-radius: 12px; box-shadow: var(--lift-shadow); }
.add-wrap { position: relative; display: inline-flex; }
.add-wrap .menu { top: calc(100% + 6px); animation: fade .15s ease; }
.menu.right { left: auto; right: 0; }
.menu .mi { display: flex; align-items: center; gap: 10px; }
.menu .mi svg.i { width: 16px; height: 16px; color: var(--label-2); }
.pills .menu button { width: 100%; padding: 9px 12px; border-radius: 8px; background: none; font: var(--t-body); color: var(--label); }
.pills .menu button:hover { background: var(--fill); }
.menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; font: var(--t-body); }
.menu button:hover { background: var(--fill); }
.menu .danger { color: var(--red); }

.sheet-head { display: grid; gap: 12px; padding: 0 20px 14px; border-bottom: .5px solid var(--sep); }
.f-title { padding: 2px 0 0; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button {
  display: inline-flex; align-items: center; gap: 6px;
  font: var(--t-sub); font-weight: 500; padding: 6px 12px; border-radius: 99px;
  background: var(--fill); color: var(--label); white-space: nowrap;
}
.pills button:hover { background: var(--fill-strong); }
.pills button svg.i { width: 13px; height: 13px; }
.pills .n { color: var(--label-2); font-variant-numeric: tabular-nums; }
.pills .due-soon { color: var(--orange); }
.pills .due-late { color: var(--red); }
.pills button[aria-selected="true"] { background: var(--label); color: var(--surface); }
.pills button[aria-selected="true"] .n { color: inherit; opacity: .65; }
.pills button[aria-selected="true"] .due-soon, .pills button[aria-selected="true"] .due-late { color: inherit; }
.pills .ghost-pill { background: none; color: var(--blue); box-shadow: inset 0 0 0 1px var(--sep); }
.pills .ghost-pill:hover { background: var(--fill); }
.pills .plus-pill { width: 32px; justify-content: center; padding-inline: 0; }
.pills .plus-pill svg.i { width: 15px; height: 15px; stroke-width: 2; }
.pills .menu .mi { gap: 8px; }
.menu .mk { width: 16px; display: grid; place-items: center; color: var(--blue); }
.menu .mk svg.i { width: 14px; height: 14px; stroke-width: 2.2; color: var(--blue); }
.menu .mi small { margin-left: auto; padding-left: 16px; font: var(--t-cap); color: var(--label-3); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

.sheet-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 24px; }
/* nome della sezione aperta, in cima al contenuto: grande come un titolo, ma grigio */
.sec-title { margin: 0 0 14px; font: var(--t-title); letter-spacing: -.01em; color: var(--label-3); }
[data-skin="carta"] .sec-title { font: 600 13px/1.4 var(--font); text-transform: uppercase; letter-spacing: var(--caps); color: var(--label-2); }
.notes-x {
  width: 100%; height: 100%; min-height: 8em; border: 0; background: none; resize: none; padding: 0;
  font: var(--t-body); line-height: 1.55; display: block;
}
.notes-x:focus { outline: none; }
.notes-x::placeholder, .inline::placeholder { color: var(--label-3); }

/* Descrizione formattata (stesso aspetto in lettura e in modifica) */
.rich { font: var(--t-body); line-height: 1.55; overflow-wrap: anywhere; }
.rich > :first-child { margin-top: 0; }
.rich > :last-child { margin-bottom: 0; }
.rich p, .rich div { margin: 0 0 8px; }
.rich h2 { font: var(--t-title); letter-spacing: -.01em; margin: 18px 0 6px; }
.rich h3 { font: var(--t-head); font-size: 17px; letter-spacing: -.01em; margin: 16px 0 6px; }
.rich ul, .rich ol { margin: 0 0 8px; padding-left: 1.4em; }
.rich li { margin: 2px 0; padding-left: 2px; }
.rich li::marker { color: var(--label-2); }
.rich a { color: var(--blue); text-decoration: none; }
.rich a:hover { text-decoration: underline; }
.rich s, .rich strike { color: var(--label-2); }
.desc-view { white-space: normal; }
.rte { border-radius: 10px; border: 1.5px solid var(--blue); background: var(--bg); }
.rte-bar { display: flex; align-items: center; gap: 2px; padding: 4px 6px; border-bottom: .5px solid var(--sep); background: var(--surface); min-height: 42px; border-radius: 8.5px 8.5px 0 0; flex-wrap: wrap; }
.rte-dd { position: relative; display: inline-flex; }
.rte-btn.wide { width: auto; padding: 0 6px; gap: 2px; display: inline-flex; align-items: center; }
.rte-btn .tt { font: 500 16px/1 var(--font); letter-spacing: -.02em; }
.rte-btn b { font-weight: 700; font-size: 16px; }
.rte-btn .dd-chev { width: 12px; height: 12px; stroke-width: 1.8; }
.split-btn .rte-btn:first-child { border-radius: 6px 0 0 6px; }
.rte-btn.chev-btn { width: 18px; border-radius: 0 6px 6px 0; }
.rte-menu { top: calc(100% + 4px); left: 0; min-width: 190px; z-index: 6; }
.rte-menu .mi { display: flex; align-items: center; gap: 10px; }
.rte-menu .mi svg.i { width: 17px; height: 17px; color: var(--label-2); }
.rte-menu .m-h2 { font: var(--t-title); font-size: 18px; }
.rte-menu .m-h3 { font: var(--t-head); font-size: 16px; }
.rte-btn { width: 32px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--label-2); font: 600 15px/1 var(--font); }
.rte-btn:hover { background: var(--fill); color: var(--label); }
.rte-btn[aria-pressed="true"] { background: var(--fill-strong); color: var(--label); }
.rte-btn svg.i { width: 17px; height: 17px; }
.rte-btn .it { font-style: italic; font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 17px; }
.rte-sep { width: .5px; height: 18px; background: var(--sep); margin: 0 4px; }
.rte-link { flex: 1; min-width: 0; border: 0; background: none; padding: 6px 8px; font: var(--t-body); }
.rte-link:focus { outline: none; }
.rte-area { min-height: 180px; padding: 12px 14px; border-radius: 0 0 8.5px 8.5px; }
.rte-area:focus { outline: none; }
.rte-area:empty::before { content: attr(data-placeholder); color: var(--label-3); }
.desc-actions { align-items: center; flex-wrap: wrap; }
.rte-tip { font: var(--t-cap); color: var(--label-3); margin-left: auto; }
@media (max-width: 720px) { .rte-tip { display: none; } }

/* Variante con barra laterale a destra */
.sheet.side { width: min(780px, 100%); }
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 216px; border-top: .5px solid var(--sep); }
.content-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.sheet.side .sheet-head { border-bottom: 0; padding-bottom: 12px; }
.sidenav { display: flex; flex-direction: column; gap: 1px; padding: 10px 8px; border-left: .5px solid var(--sep); overflow-y: auto; background: color-mix(in srgb, var(--fill) 40%, var(--surface)); }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; font: var(--t-body); color: var(--label); text-align: left; }
.nav-item > svg.i { width: 18px; height: 18px; color: var(--label-2); }
.nav-item:hover { background: var(--fill); }
.nav-item[aria-selected="true"] { background: var(--fill-strong); font-weight: 600; }
.nav-item[aria-selected="true"] > svg.i { color: var(--blue); }
.nav-item .nl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .nm { flex: none; }
.nav-item .nm { font: var(--t-cap); color: var(--label-3); font-variant-numeric: tabular-nums; }
.nav-item .nm .due-soon { color: var(--orange); }
.nav-item .nm .due-late { color: var(--red); }
.nav-item .nm .av { width: 18px; height: 18px; font-size: 8px; box-shadow: none; }
/* pulsante per aprire e chiudere la barra: serve solo su telefono */
.nav-toggle { display: none; }
.nav-item.quiet, .nav-item.quiet > svg.i { color: var(--blue); }
.nav-sep { height: .5px; background: var(--sep); margin: 8px 10px; }
.nav-add { display: block; }
.nav-add .menu { left: auto; right: 0; }
.variant { display: flex; background: var(--fill); border-radius: 8px; padding: 2px; }
.variant button { font: var(--t-cap); padding: 4px 10px; border-radius: 6px; white-space: nowrap; color: var(--label-2); }
.variant button[aria-pressed="true"] { background: var(--surface); color: var(--label); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (max-width: 720px) {
  /* Su telefono la barra resta a destra: chiusa è una striscia di icone, aperta mostra anche i nomi
     e spinge il contenuto verso sinistra (effetto push) */
  .split { grid-template-columns: 1fr; position: relative; overflow: hidden; }
  .content-col { margin-right: 56px; transition: transform .3s cubic-bezier(.2,.9,.3,1); }
  .split.nav-open .content-col { transform: translateX(-176px); }
  .sidenav {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 2; width: 56px; padding: 8px 6px;
    overflow-x: hidden; transition: width .3s cubic-bezier(.2,.9,.3,1), box-shadow .3s;
  }
  .split.nav-open .sidenav { width: 232px; box-shadow: -10px 0 30px rgba(0,0,0,.08); }
  .nav-item { width: 220px; padding: 11px; gap: 12px; white-space: nowrap; }
  .nav-item .nl, .nav-item .nm { transition: opacity .2s; }
  .split:not(.nav-open) .nav-item .nl, .split:not(.nav-open) .nav-item .nm { opacity: 0; }
  .nav-toggle { display: flex; color: var(--label); }
  .nav-toggle > svg.i { color: var(--label); }
  .nav-add .menu { right: auto; left: 0; }
}

/* Pagina iniziale */
.logout { font: var(--t-sub); color: var(--blue); padding: 4px 2px; }
.save-status {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  font: var(--t-sub); color: #fff; background: var(--red); padding: 8px 14px; border-radius: 99px; box-shadow: var(--lift-shadow); white-space: nowrap;
}
.home-empty { font: var(--t-body); color: var(--label-2); margin: 4px 0 0; }
.home { height: 100%; overflow-y: auto; }
.brand { font: 700 12px/1 var(--font); letter-spacing: .16em; color: var(--label-2); }
.home-title { font: var(--t-large); letter-spacing: -.022em; margin: 0; }
.home-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 6px 40px;
}
.tile {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
  min-height: 112px; padding: 16px 16px 14px; border-radius: 14px;
  background: var(--surface); box-shadow: var(--card-shadow); text-align: left; cursor: pointer;
  transition: box-shadow .15s;
}
.tile:hover { box-shadow: var(--lift-shadow); }
.tile h2 { font: var(--t-title); font-size: 18px; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.tile-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font: var(--t-cap); min-height: 16px; font-variant-numeric: tabular-nums; }
/* campitura di colore in cima alla bacheca, come su Trello */
.tile .swatch { height: 96px; margin: -16px -16px 0; border-radius: 14px 14px 0 0; background: var(--bc); }
.tile-more { position: absolute; top: 10px; right: 10px; }
.tile:has(.tile-more .menu) { z-index: 5; }
.tile-more .icon-btn { width: 28px; height: 28px; color: #fff; background: rgba(0,0,0,.2); opacity: 0; transition: opacity .15s; }
.tile:hover .tile-more .icon-btn, .tile:focus-within .tile-more .icon-btn, .tile-more .icon-btn[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .tile-more .icon-btn { opacity: 1; } }
.tile-new {
  flex-direction: row; align-items: center; justify-content: center; gap: 6px;
  background: none; box-shadow: none; border: 1.5px dashed var(--fill-strong);
  color: var(--label-2); font: var(--t-body);
}
.tile-new:hover { background: var(--fill); box-shadow: none; color: var(--label); }
.alert-wrap.fixed { position: fixed; z-index: 40; }

/* Avviso di conferma, nello stile degli avvisi di iPhone */
.alert-wrap { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: var(--scrim); animation: fade .15s ease; }
.alert { width: min(280px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--lift-shadow); text-align: center; overflow: hidden; }
.alert h3 { font: var(--t-head); margin: 18px 16px 4px; text-wrap: balance; }
.alert p { font: var(--t-sub); color: var(--label-2); margin: 0 16px 16px; text-wrap: balance; }
.alert.space { width: min(360px, 100%); text-align: left; }
.alert.space h3 { text-align: center; }
.sp-body { display: grid; gap: 8px; padding: 0 16px 14px; }
.sp-input { width: 100%; font: var(--t-body); color: var(--label); background: var(--bg); border: .5px solid var(--sep); border-radius: 10px; padding: 10px 12px; }
.alert .sp-label { font: var(--t-cap); color: var(--label-2); margin: 8px 0 0; }
#space-menu { min-width: 230px; }
#space-menu .mi { white-space: nowrap; }
#space-menu .vt small { margin-left: 0; padding-left: 0; }
.sp-list { list-style: none; margin: 0; padding: 0; }
.sp-list li { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: .5px solid var(--sep); font: var(--t-sub); }
.sp-list li span { flex: 1; min-width: 0; overflow-wrap: anywhere; display: grid; }
.sp-list li span small { font: var(--t-cap); color: var(--label-2); }
.sp-list li button.ok { color: var(--blue); }
.alert-actions.one { grid-template-columns: 1fr; }
.sp-list li.none { color: var(--label-2); }
.alert-actions button:disabled { color: var(--label-3); cursor: default; background: none; }
.sp-list button { font: var(--t-sub); color: var(--red); }
.sp-add { display: flex; gap: 8px; }
.sp-add button { font: var(--t-body); font-weight: 600; color: var(--blue); padding: 0 4px; }
.alert .sp-note { font: var(--t-cap); color: var(--label-2); margin: 2px 0 0; text-wrap: pretty; }
.toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; max-width: calc(100% - 32px);
  font: var(--t-sub); color: var(--surface); background: var(--label); padding: 8px 14px; border-radius: 14px; box-shadow: var(--lift-shadow); text-align: center;
}
[data-skin="carta"] .toast, [data-skin="carta"] .sp-input { border-radius: 0; }
.alert-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: .5px solid var(--sep); }
.alert-actions button { padding: 11px 8px; font: var(--t-body); color: var(--blue); }
.alert-actions button + button { border-left: .5px solid var(--sep); }
.alert-actions button:hover { background: var(--fill); }
.alert-actions .strong { font-weight: 600; }
.alert-actions .danger { color: var(--red); }

/* Checklist come su Trello: barra di avanzamento, quadratini, nessun riquadro */
.cl-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cl-pct { font: var(--t-cap); color: var(--label-2); width: 4ch; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--blue); transition: width .25s; }
.bar.full i { background: var(--green); }
.cl-item { display: flex; align-items: flex-start; gap: 10px; padding: 5px 8px; margin: 0 -8px; border-radius: 8px; }
.cl-item:hover, .cl-item:focus-within { background: var(--fill); }
.cb { width: 16px; height: 16px; margin-top: 3px; border-radius: 4px; border: 1.5px solid var(--label-3); display: grid; place-items: center; flex: none; color: var(--on-accent); }
.cb svg.i { width: 11px; height: 11px; stroke-width: 2.6; opacity: 0; }
.cb[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); }
.cb[aria-pressed="true"] svg.i { opacity: 1; }
.cl-item .inline { flex: 1; min-width: 0; border: 0; background: none; padding: 0; font: var(--t-body); line-height: 1.45; }
.cl-item .inline:focus { outline: none; }
.cb[aria-pressed="true"] + .inline { color: var(--label-2); text-decoration: line-through; text-decoration-color: var(--label-3); }
.rm { opacity: 0; transition: opacity .15s; width: 22px; height: 22px; }
.cl-item:hover .rm, .cl-item:focus-within .rm, .link-row:hover .rm { opacity: 1; }
@media (hover: none) { .rm { opacity: 1; } }
.add-item { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; font: var(--t-sub); font-weight: 500; padding: 6px 12px; border-radius: 8px; background: var(--fill); }
.add-item:hover { background: var(--fill-strong); }
.add-item svg.i { width: 13px; height: 13px; }
.add-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; margin-top: 4px; }
.add-row .inline { flex: 1; min-width: 0; border: 0; border-bottom: 1.5px solid var(--blue); background: none; padding: 4px 0; font: var(--t-body); }
.add-row .inline:focus { outline: none; }

.link-row { display: flex; align-items: center; gap: 10px; padding: 4px 8px; margin: 0 -8px; border-radius: 8px; }
.link-row:hover { background: var(--fill); }
.link-row > svg.i { color: var(--label-3); }

.due-state { font: var(--t-head); margin: 0 0 14px; }
.due-state.due-soon { color: var(--orange); }
.due-state.due-late { color: var(--red); }
.due-state.none { color: var(--label-3); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.date-field { border: 0; background: var(--fill); border-radius: 8px; padding: 7px 10px; font: var(--t-body); color: var(--label); }

.msgs { display: flex; flex-direction: column; gap: 20px; }
.msg { display: grid; gap: 6px; }
.msg-head { display: flex; align-items: center; gap: 8px; }
.msg-head .av { width: 28px; height: 28px; font-size: 10px; box-shadow: none; }
.msg-head .who { font: var(--t-head); }
.msg-head .when { font: var(--t-cap); color: var(--label-3); font-variant-numeric: tabular-nums; }
.msg-body { margin-left: 36px; padding: 10px 13px; border-radius: 10px; background: var(--fill); }
.msg.me .msg-body { background: color-mix(in srgb, var(--blue) 9%, var(--surface)); }
.msg-actions { margin-left: 36px; display: flex; align-items: center; gap: 6px; font: var(--t-cap); color: var(--label-3); }
.msg-actions button { font: inherit; color: var(--label-2); padding: 2px 0; }
.msg-actions button:hover { color: var(--label); text-decoration: underline; }
/* sul computer Modifica · Elimina compaiono passando sopra il messaggio; sul telefono restano visibili */
@media (hover: hover) {
  .msg-actions { opacity: 0; transition: opacity .15s; }
  .msg:hover .msg-actions, .msg:focus-within .msg-actions { opacity: 1; }
}
.msg-edit { margin-left: 36px; }
.msg-edit .rte-area { min-height: 90px; }
.empty { font: var(--t-sub); color: var(--label-3); text-align: center; margin: 32px auto; max-width: 30ch; text-wrap: balance; }
.composer { display: flex; flex-direction: column; gap: 6px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: .5px solid var(--sep); }
.composer-row { display: flex; align-items: flex-end; gap: 8px; }
.msg-input { flex: 1; min-width: 0; max-height: 40vh; overflow-y: auto; border: .5px solid var(--sep); background: var(--bg); border-radius: 18px; padding: 7px 14px; }
.msg-input:focus { outline: none; border-color: var(--blue); }
.msg-input:empty::before { content: attr(data-placeholder); color: var(--label-3); }
.msg-input p, .msg-input ul, .msg-input ol { margin-bottom: 4px; }
.aa-btn { width: 32px; height: 32px; border-radius: 50%; flex: none; font: 600 14px/1 var(--font); color: var(--label-2); }
.aa-btn:hover { background: var(--fill); }
.aa-btn[aria-pressed="true"] { background: var(--fill-strong); color: var(--blue); }
.rte-bar.mini { border: 0; border-radius: 0; margin: 0; padding: 0 0 0 36px; min-height: 34px; background: none; }
.rte-bar.mini .rte-menu { top: auto; bottom: calc(100% + 4px); }
.composer input { flex: 1; min-width: 0; border: .5px solid var(--sep); background: var(--bg); border-radius: 99px; padding: 8px 14px; font: var(--t-body); }
.composer input:focus { outline: none; border-color: var(--blue); }
.send { width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.send svg.i { width: 16px; height: 16px; stroke-width: 2.2; }

@media (max-width: 720px) {
  .sheet { height: 100%; }
  .sheet-head, .sheet-panel { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
}

/* Descrizione */
.desc-view {
  display: block; width: calc(100% + 20px); margin: -8px -10px 0; padding: 8px 10px; border-radius: 8px;
  text-align: left; white-space: pre-wrap; font: var(--t-body); line-height: 1.55; cursor: text;
}
.desc-view:hover { background: var(--fill); }
.desc-hint { margin-top: 10px; font: var(--t-sub); font-weight: 500; color: var(--blue); }
.desc-empty { display: block; width: 100%; min-height: 84px; padding: 10px 12px; border-radius: 10px; background: var(--fill); color: var(--label-2); font: var(--t-body); text-align: left; vertical-align: top; }
.desc-empty:hover { background: var(--fill-strong); }
.desc-edit {
  display: block; width: 100%; min-height: 180px; resize: vertical; padding: 10px 12px;
  border: 0; border-radius: 10px; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--blue);
  font: var(--t-body); line-height: 1.55;
}
.desc-edit:focus { outline: none; }
.desc-edit::placeholder { color: var(--label-3); }
.desc-actions { display: flex; gap: 8px; margin-top: 10px; }
.btn-fill { background: var(--blue); color: var(--on-accent); font: var(--t-sub); font-weight: 600; padding: 7px 14px; border-radius: 8px; }
.btn-plain { font: var(--t-sub); font-weight: 500; padding: 7px 10px; border-radius: 8px; color: var(--label-2); }
.btn-plain:hover { background: var(--fill); color: var(--label); }

/* Membri */
.avs { display: inline-flex; }
.av {
  width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center;
  background: var(--fill-strong); color: var(--label); font: 600 9.5px/1 var(--font); letter-spacing: .02em;
  box-shadow: 0 0 0 2px var(--surface);
}
.av.me { background: var(--blue); color: var(--on-accent); }
.av + .av { margin-left: -5px; }
.meta .avs { margin-left: auto; }
.pills .avs { margin-left: 2px; }
.pills .av { width: 18px; height: 18px; font-size: 8px; box-shadow: none; }
.pills .av + .av { margin-left: -3px; }
.pills button[aria-selected="true"] .av:not(.me) { background: color-mix(in srgb, var(--surface) 30%, transparent); color: var(--surface); }
.member-row { display: flex; align-items: center; gap: 12px; width: calc(100% + 16px); margin: 0 -8px; padding: 8px; border-radius: 10px; text-align: left; }
.member-row:hover { background: var(--fill); }

<script>
const TZ = 'Europe/Rome';
const today = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5);
const fmtShort = iso => new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'short', timeZone: 'UTC' }).format(new Date(iso + 'T00:00:00Z'));
const fmtLong = iso => new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(iso + 'T00:00:00Z'));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const id = () => 'k' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const ICON = {
  cal: '<svg class="i" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg>',
  check: '<svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.75"/><path d="m5.6 8.2 1.7 1.7 3.2-3.6"/></svg>',
  tick: '<svg class="i" viewBox="0 0 16 16"><path d="m4 8.4 2.6 2.6L12 5.2"/></svg>',
  note: '<svg class="i" viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg>',
  link: '<svg class="i" viewBox="0 0 16 16"><path d="M7 9a2.5 2.5 0 0 0 3.5 0l2-2A2.5 2.5 0 0 0 9 3.5l-.8.8M9 7a2.5 2.5 0 0 0-3.5 0l-2 2A2.5 2.5 0 0 0 7 12.5l.8-.8"/></svg>',
  plus: '<svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>',
  x: '<svg class="i" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></svg>',
  chev: '<svg class="i" viewBox="0 0 16 16"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg>',
  tag: '<svg class="i" viewBox="0 0 16 16"><path d="M2.5 8.6V3.5a1 1 0 0 1 1-1h5.1l5 5a1 1 0 0 1 0 1.4l-4.7 4.7a1 1 0 0 1-1.4 0z"/><circle cx="5.6" cy="5.6" r=".9" fill="currentColor" stroke="none"/></svg>',
  up: '<svg class="i" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></svg>',
  msg: '<svg class="i" viewBox="0 0 16 16"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h7A1.5 1.5 0 0 1 13 4.5v5a1.5 1.5 0 0 1-1.5 1.5H7.2L4.5 13v-2a1.5 1.5 0 0 1-1.5-1.5z"/></svg>',
  side: '<svg class="i" viewBox="0 0 16 16"><rect x="2" y="2.75" width="12" height="10.5" rx="2"/><path d="M10 2.75v10.5"/></svg>',
  chevr: '<svg class="i" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg>',
  chevl: '<svg class="i" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>',
  person: '<svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.4 2.6-3.8 5-3.8s4.4 1.4 5 3.8"/></svg>',
  more: '<svg class="i" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="12.5" cy="8" r="1.2" fill="currentColor" stroke="none"/></svg>'
};
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };

let state = null;

/* Ogni bacheca nasce con le tre colonne fisse e il set di etichette di base */
function makeBoard(title, cards = []) {
  const b = {
    id: id(), title, created: today, view: 'essential', adding: null, open: null,
    labels: [['Logo', 'blue'], ['Stampa', 'orange'], ['Web', 'teal'], ['Amministrazione', 'purple'], ['Urgente', 'red']].map(([name, c]) => ({ id: id(), name, color: `var(--${c})` })),
    space, people: peopleOf(space),
    columns: [['In corso', 'in_corso'], ['In revisione', 'in_revisione'], ['Fatto', 'fatto']].map(([t, type]) => ({ id: id(), title: t, type }))
  };
  b.cards = cards.map(([col, t, due]) => ({
    id: id(), col: b.columns[col].id, title: t, labels: [], due: due == null ? null : addDays(today, due),
    notes: '', checklist: [], links: [], messages: [], members: [], modules: due == null ? [] : ['due']
  }));
  return b;
}
/* Salvataggio. Su Vercel i dati vanno nel database tramite le API; se le API non ci sono
   (anteprima senza server) restano in questo browser. L'interfaccia si aggiorna subito e
   salva in background; se il salvataggio non riesce lo segnala e riprova. */
const STORE = 'flow-v1';
let boards = [], mode = 'server', saving = false, saveTimer = null, retryDelay = 0;
const dirty = new Set(), removed = new Set(), lastSaved = new Map();
const serialize = ({ open, adding, people, version, by, ...rest }) => rest;

/* Chi sta usando Flow e gli spazi che vede. Senza server (anteprima) c'è solo "Io". */
let ME = { email: 'io', name: 'Io', picture: '', admin: true };
let spaces = [{ id: 'principale', name: 'Il mio spazio', people: [{ email: 'io', name: 'Io', picture: '' }] }];
let space = 'principale';
try { space = localStorage.getItem('flow-space') || space; } catch {}
const spaceOf = sid => spaces.find(x => x.id === sid);
const initialsOf = name => (name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('') || '?').toUpperCase();
function peopleOf(sid) {
  return (spaceOf(sid)?.people || []).map(p => ({ id: p.email, name: p.name, role: p.email === ME.email ? 'Tu' : p.email, initials: initialsOf(p.name), me: p.email === ME.email }));
}
function setSpace(sid) {
  space = spaceOf(sid) ? sid : spaces[0]?.id;
  try { localStorage.setItem('flow-space', space); } catch {}
}

function persist() {
  /* si salva solo se la bacheca è davvero cambiata rispetto all'ultima versione salvata */
  if (!state) return;
  if (lastSaved.get(state.id) === JSON.stringify(serialize(state))) return;
  dirty.add(state.id); scheduleSave();
}
function removeBoard(bid) { dirty.delete(bid); removed.add(bid); lastSaved.delete(bid); scheduleSave(0); }
function scheduleSave(ms = 600) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, ms); }

/* Quando due persone modificano la stessa bacheca: si parte dalla versione dell'altro e si
   rimettono sopra le proprie modifiche, scheda per scheda. I messaggi si sommano. */
function mergeBoard(base, mine, theirs) {
  const same = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  const out = { ...theirs };
  for (const k of ['title', 'view', 'color', 'labels', 'columns']) if (!same(mine[k], base[k])) out[k] = mine[k];
  const byId = list => new Map((list || []).map(c => [c.id, c]));
  const B = byId(base.cards), M = byId(mine.cards), T = byId(theirs.cards);
  const cards = [];
  for (const c of theirs.cards) {
    if (B.has(c.id) && !M.has(c.id)) continue; /* l'ho eliminata io */
    const m = M.get(c.id);
    if (!m || same(m, B.get(c.id))) { cards.push(c); continue; }
    const known = new Set([...(B.get(c.id)?.messages || []), ...m.messages].map(x => x.id));
    cards.push({ ...m, messages: [...m.messages, ...c.messages.filter(x => !known.has(x.id))].sort((x, y) => x.at - y.at) });
  }
  for (const m of mine.cards) if (!B.has(m.id) && !T.has(m.id)) cards.push(m); /* nuove mie */
  out.cards = cards;
  return out;
}
function adoptServerBoard(b, sb) {
  /* sostituisce il contenuto di una bacheca con quello del server, senza chiudere ciò che è aperto */
  const { open, adding } = b;
  for (const k of Object.keys(b)) delete b[k];
  Object.assign(b, sb, { people: peopleOf(sb.space) });
  b.open = b.cards.some(c => c.id === open) ? open : null; b.adding = adding;
}
let toastTimer = null;
function toast(text) {
  const el = $('#toast'); el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
}
function rerender() {
  if (!appEl.hidden && state) {
    if (!boards.includes(state)) { showHome(); return; }
    renderBoard(); if (state.open) renderSheet();
  } else renderHome();
}

async function flush({ keepalive = false } = {}) {
  if (mode === 'local') {
    try { localStorage.setItem(STORE, JSON.stringify({ boards: boards.map(serialize) })); } catch {}
    dirty.clear(); removed.clear(); return;
  }
  if (saving) { scheduleSave(300); return; }
  saving = true;
  let failed = false, again = false;
  const jobs = [...removed].map(bid => ['DELETE', bid]).concat([...dirty].map(bid => ['PUT', bid]));
  removed.clear(); dirty.clear();
  for (const [method, bid] of jobs) {
    const b = boards.find(x => x.id === bid);
    if (method === 'PUT' && !b) continue;
    const sent = b && serialize(b);
    const body = method === 'PUT' ? JSON.stringify({ board: sent, posizione: boards.indexOf(b), version: b.version || 0 }) : undefined;
    try {
      const r = await fetch('/api/boards/' + encodeURIComponent(bid), {
        method, body, headers: body ? { 'Content-Type': 'application/json' } : {},
        keepalive: keepalive && (!body || body.length < 60000)
      });
      if (r.status === 401) { location.href = '/login'; return; }
      const data = await r.json().catch(() => ({}));
      if (r.status === 409 && data.board) {
        /* qualcun altro ha salvato prima: si uniscono le modifiche e si riprova */
        const base = JSON.parse(lastSaved.get(bid) || 'null') || { cards: [] };
        const merged = mergeBoard(base, serialize(b), serialize(data.board));
        adoptServerBoard(b, { ...data.board, ...merged });
        lastSaved.set(bid, JSON.stringify(serialize(data.board)));
        if (lastSaved.get(bid) !== JSON.stringify(serialize(b))) { dirty.add(bid); again = true; }
        toast(`${data.board.by || 'Qualcuno'} ha appena modificato questa bacheca: ho unito le modifiche.`);
        rerender();
        continue;
      }
      if (r.status === 403) { toast(data.error || 'Non hai accesso a questa bacheca.'); continue; }
      if (!r.ok) throw new Error(r.status);
      if (b && method === 'PUT') {
        b.version = data.version;
        lastSaved.set(bid, JSON.stringify(sent));
        if (JSON.stringify(serialize(b)) !== lastSaved.get(bid)) dirty.add(bid);
      }
    } catch {
      failed = true;
      (method === 'PUT' ? dirty : removed).add(bid);
    }
  }
  saving = false;
  $('#save-status').hidden = !failed;
  if (failed) { retryDelay = Math.min((retryDelay || 2000) * 2, 30000); scheduleSave(retryDelay); }
  else { retryDelay = 0; if (again || dirty.size) scheduleSave(0); }
}
document.addEventListener('input', persist);
addEventListener('pagehide', () => { if (dirty.size || removed.size) flush({ keepalive: true }); });

async function fetchState() {
  const r = await fetch('/api/state', { cache: 'no-store' });
  if (r.status === 401) { location.href = '/login'; return null; }
  if (!(r.headers.get('content-type') || '').includes('json')) throw Object.assign(new Error('no-api'), { noApi: true });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}
function adoptSpaces(data) {
  ME = data.me; spaces = data.spaces || [];
  setSpace(space);
}
function adopt(list) {
  boards = list || [];
  lastSaved.clear();
  for (const b of boards) {
    b.open = null; b.adding = null; b.space ||= space; b.people = peopleOf(b.space);
    lastSaved.set(b.id, JSON.stringify(serialize(b)));
  }
}
async function boot() {
  $('#home-empty').textContent = 'Caricamento…'; $('#home-empty').hidden = false;
  try {
    const data = await fetchState();
    if (!data) return;
    adoptSpaces(data);
    adopt(data.boards);
  } catch (err) {
    if (err.noApi || location.protocol === 'file:') {
      /* nessun server: anteprima, i dati restano nel browser */
      mode = 'local'; space = 'principale';
      let saved = [];
      try { saved = JSON.parse(localStorage.getItem(STORE))?.boards || []; } catch {}
      adopt(saved);
      $('#logout').hidden = true;
    } else {
      $('#home-empty').textContent = 'Non riesco a leggere i dati. Controlla la connessione e ricarica la pagina.';
      return;
    }
  }
  showHome();
}
/* Si ricaricano le modifiche degli altri: tornando su FLOW e ogni 20 secondi,
   ma non mentre si scrive o si sta salvando */
async function refresh() {
  if (mode !== 'server' || document.visibilityState !== 'visible' || saving || removed.size) return;
  if (document.activeElement?.matches?.('input, textarea, [contenteditable]') || drag) return;
  let data;
  try { data = await fetchState(); } catch { return; }
  if (!data || saving || removed.size) return;
  adoptSpaces(data);
  const ids = new Set(data.boards.map(b => b.id));
  let changed = false;
  for (const sb of data.boards) {
    const b = boards.find(x => x.id === sb.id);
    if (!b) { sb.open = sb.adding = null; sb.people = peopleOf(sb.space); boards.push(sb); lastSaved.set(sb.id, JSON.stringify(serialize(sb))); changed = true; continue; }
    b.people = peopleOf(b.space);
    if (b.version === sb.version || dirty.has(b.id)) continue;
    adoptServerBoard(b, sb); lastSaved.set(b.id, JSON.stringify(serialize(b))); changed = true;
  }
  /* bacheche eliminate da altri (quelle nuove non ancora salvate restano) */
  for (let i = boards.length - 1; i >= 0; i--) {
    const b = boards[i];
    if (!ids.has(b.id) && b.version && !dirty.has(b.id)) { boards.splice(i, 1); lastSaved.delete(b.id); changed = true; }
  }
  boards.sort((x, y) => (data.boards.findIndex(b => b.id === x.id) + 1 || 1e9) - (data.boards.findIndex(b => b.id === y.id) + 1 || 1e9));
  if (changed || homeEl.hidden === false) rerender();
}
document.addEventListener('visibilitychange', refresh);
setInterval(refresh, 20000);

function dueInfo(due, done) {
  if (!due) return null;
  const d = diffDays(due, today);
  if (done) return { cls: '', text: fmtShort(due) };
  if (d < 0) return { cls: 'due-late', text: fmtShort(due) };
  if (d === 0) return { cls: 'due-soon', text: 'Oggi' };
  if (d === 1) return { cls: 'due-soon', text: 'Domani' };
  if (d <= 3) return { cls: 'due-soon', text: fmtShort(due) };
  return { cls: '', text: fmtShort(due) };
}

/* Trascinamento: con il mouse parte appena muovi, con il dito dopo una breve pressione */
let drag = null, justDragged = false;
const ph = document.createElement('div'); ph.className = 'ph';

boardEl.addEventListener('pointerdown', e => {
  const card = e.target.closest('[data-card]');
  if (!card || e.button !== 0) return;
  const p = { card, id: card.dataset.card, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse', active: false, timer: null };

window.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.active) {
    const dist = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
    if (drag.touch) { if (dist > 8) cancelPending(); }

boardEl.addEventListener('contextmenu', e => { if (e.target.closest('[data-card]')) e.preventDefault(); });

function cancelPending() { clearTimeout(drag.timer); drag = null; }
function startDrag(p) {

  p.active = true;
  const r = p.card.getBoundingClientRect();
  p.dx = p.x0 - r.left; p.dy = p.y0 - r.top;
  const g = p.card.cloneNode(true);
  g.className = 'card ghost'; g.removeAttribute('data-card'); g.removeAttribute('tabindex'); g.style.width = r.width + 'px';

  boardEl.querySelectorAll('.col.over').forEach(c => c !== col && c.classList.remove('over'));
  col.classList.add('over');
  const list = col.querySelector('.list');
  const after = [...list.querySelectorAll('.card:not(.dragging)')].find(el => { const r = el.getBoundingClientRect(); return drag.y < r.top + r.height / 2; });
  if (after) { if (after.previousElementSibling !== ph) list.insertBefore(ph, after); }

}
/* Vicino ai bordi la bacheca (e la colonna) scorrono da sole */

  const b = boardEl.getBoundingClientRect(), edge = 56;

  if (drag.x < b.left + edge) { boardEl.scrollLeft -= 14; moved = true; }
  else if (drag.x > b.right - edge) { boardEl.scrollLeft += 14; moved = true; }
  const list = ph.parentElement;
  if (list) {
    const r = list.getBoundingClientRect();
    if (drag.y < r.top + 32 && list.scrollTop > 0) { list.scrollTop -= 10; moved = true; }
    else if (drag.y > r.bottom - 32 && list.scrollTop + list.clientHeight < list.scrollHeight) { list.scrollTop += 10; moved = true; }
  }
  if (moved) placePh();
  requestAnimationFrame(autoScroll);
}
function finishDrag() {
  if (!drag) return;
  clearTimeout(drag.timer);

  const card = cardOf(drag.id), list = ph.parentElement;
  if (list) {
    let next = ph.nextElementSibling;
    while (next && next.classList.contains('dragging')) next = next.nextElementSibling;
    state.cards.splice(state.cards.indexOf(card), 1);
    card.col = list.dataset.list;
    if (next?.dataset.card) state.cards.splice(state.cards.indexOf(cardOf(next.dataset.card)), 0, card);
    else { const last = state.cards.map(c => c.col).lastIndexOf(card.col); state.cards.splice(last + 1, 0, card); }
  }
  drag.ghost.remove(); ph.remove();
  boardEl.classList.remove('is-dragging'); document.body.classList.remove('grabbing');
  drag = null;
  justDragged = true; setTimeout(() => { justDragged = false; }, 60);
  renderBoard();
}

function cleanHTML(html) {

sheetEl.addEventListener('click', e => {

    return;
  }
  const pr = t.closest('[data-spacepromote]');
  if (pr) { if (await spaceApi('PATCH', path, { promote: pr.dataset.spacepromote })) renderHome(); return; }
  if (t.closest('[data-spacedelete]')) { if (await spaceApi('DELETE', path)) { setSpace(spaces[0]?.id); closeSheetHome(); } }
});

function showHome() {
  if (state) { state.open = null; renderSheet(); }
  appEl.hidden = true; homeEl.hidden = false;
  renderHome();
}
function openBoard(b) {
  state = b; homeUi.menu = null;
  homeEl.hidden = true; appEl.hidden = false;
  boardEl.scrollLeft = 0;
  renderBoard();
}
homeEl.addEventListener('click', e => {
  const t = e.target;
  if (homeUi.menu && !t.closest('.tile-more')) { homeUi.menu = null; renderHome(); }
  const more = t.closest('[data-tilemore]');
  if (more) { homeUi.menu = homeUi.menu === more.dataset.tilemore && !more.classList.contains('sub-back') ? null : more.dataset.tilemore; renderHome(); return; }
  const bcs = t.closest('[data-boardcolors]');
  if (bcs) { homeUi.menu = 'c:' + bcs.dataset.boardcolors; renderHome(); return; }
  /* il sottomenu resta aperto: si possono provare più colori di seguito */
  const bc = t.closest('[data-boardcolor]');
  if (bc) { const b = boards.find(x => x.id === bc.dataset.board); b.color = +bc.dataset.boardcolor; dirty.add(b.id); scheduleSave(); renderHome(); return; }
  const del = t.closest('[data-delboard]');
  if (del) { homeUi.menu = null; homeUi.confirm = del.dataset.delboard; renderHome(); return; }
  if (t.closest('[data-homecancel]')) { homeUi.confirm = null; renderHome(); return; }
  if (t.closest('[data-homeok]')) { boards.splice(boards.findIndex(b => b.id === homeUi.confirm), 1); removeBoard(homeUi.confirm); homeUi.confirm = null; renderHome(); return; }
  if (t.closest('[data-newboard]')) {
    const b = makeBoard('Nuova bacheca'); boards.push(b); openBoard(b);
    const inp = $('#board-title'); inp.focus(); inp.select();
    return;
  }
  const open = t.closest('[data-openboard]');
  if (open && !t.closest('.tile-more')) openBoard(boards.find(b => b.id === open.dataset.openboard));
});
homeEl.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (homeUi.confirm || homeUi.menu || homeUi.manage || homeUi.invites)) { homeUi.confirm = homeUi.menu = null; closeSheetHome(); return; }
  const tile = e.target.closest('[data-openboard]');
  if (tile && e.target === tile && e.key === 'Enter') openBoard(boards.find(b => b.id === tile.dataset.openboard));
});
$('.back').addEventListener('click', showHome);

/* Tema: vale per questo dispositivo */
const skinBtn = $('#skin-btn'), skinMenu = $('#skin-menu');
function syncSkinMenu() {
  const cur = document.documentElement.dataset.skin || 'sistema';
  skinMenu.querySelectorAll('[data-skin-choice]').forEach(b => {
    const on = b.dataset.skinChoice === cur;
    b.setAttribute('aria-checked', String(on));
    b.querySelector('.mk').innerHTML = on ? ICON.tick : '';
  });
}
skinBtn.addEventListener('click', () => { skinMenu.hidden = !skinMenu.hidden; skinBtn.setAttribute('aria-expanded', String(!skinMenu.hidden)); syncSkinMenu(); });
skinMenu.addEventListener('click', e => {
  const b = e.target.closest('[data-skin-choice]'); if (!b) return;
  document.documentElement.dataset.skin = b.dataset.skinChoice;
  try { localStorage.setItem('flow-skin', b.dataset.skinChoice); } catch {}
  syncSkinMenu();
});
document.addEventListener('click', e => { if (!e.target.closest('#skin-wrap')) { skinMenu.hidden = true; skinBtn.setAttribute('aria-expanded', 'false'); } });

$('#logout').addEventListener('click', async () => {
  if (dirty.size || removed.size) await flush();
  await fetch('/api/logout', { method: 'POST' }).catch(() => {});
  location.href = '/login';
});
boot();
</script>
